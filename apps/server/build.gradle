plugins {
    id 'java'
    id 'checkstyle'
    id 'org.springframework.boot' version '4.1.1'
    id 'com.diffplug.spotless' version '8.10.4'
}
group = 'cw'
version = '0.1.0-provisional'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories { mavenCentral() }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    dependsOn tasks.named('bootJar')
    systemProperty 'cw.serverJar', tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath
    maxParallelForks = 1
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'short' }
    systemProperty 'cw.contractRoot', file('../../docs/contracts').absolutePath
    systemProperty 'cw.fixtureRoot', file('../../fixtures/lcu/candidates/h2-20261021').absolutePath
}
tasks.named('wrapper') {
    gradleVersion = '9.8.2'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = '21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607'
}
dependencyLocking { lockAllConfigurations() }

checkstyle {
    toolVersion = '14.3.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    // Block checks only parse source; application classes and their build are unnecessary.
    classpath = files()
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        googleJavaFormat('1.36.1').aosp()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('spotlessCheck') {
    dependsOn tasks.named('checkstyleMain'), tasks.named('checkstyleTest')
}

// Clean builds always package the same-origin UI; no pre-existing dist directory is assumed.
tasks.register('buildWeb', Exec) {
    workingDir file('../..')
    commandLine(System.getProperty('os.name').toLowerCase().contains('windows') ? 'pnpm.cmd' : 'pnpm', 'build:web')
    inputs.dir(file('../web/src'))
    inputs.file(file('../web/index.html'))
    inputs.file(file('../../vite.web.config.ts'))
    inputs.file(file('../../pnpm-lock.yaml'))
    outputs.dir(file('../web/dist'))
}
tasks.named('processResources') {
    dependsOn tasks.named('buildWeb')
    from('../web/dist') { into 'static' }
}
