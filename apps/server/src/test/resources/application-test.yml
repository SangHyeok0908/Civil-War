spring:
  datasource:
    url: ${CW_TEST_DATABASE_URL:jdbc:postgresql://localhost:55432/cw_test}
    username: ${CW_TEST_DATABASE_USER:cw_test}
    password: ${CW_TEST_DATABASE_PASSWORD:cw_test_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migrations
cw:
  origin: http://localhost:8080
  dev-http: true
logging:
  level:
    root: WARN
