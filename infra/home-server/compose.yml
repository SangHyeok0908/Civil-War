name: cw-collector-acceptance
services:
  postgres:
    image: postgres:18.6@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    environment:
      POSTGRES_DB: cw_collector_acceptance
      POSTGRES_USER: cw_collector_acceptance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [database]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U cw_collector_acceptance -d cw_collector_acceptance",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
  server:
    image: civil-war-home-server:collector-acceptance
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/cw_collector_acceptance
      DATABASE_USER: cw_collector_acceptance
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SERVER_ORIGIN: ${SERVER_ORIGIN:?Set the public HTTPS origin in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database, tunnel]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /api/members HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          IFS= read -r status <&3;
          [[ "$$status" == 'HTTP/1.1 200 '* ]]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "run",
        "--token-file",
        "/run/secrets/tunnel_token",
      ]
    secrets: [tunnel_token]
    depends_on:
      server:
        condition: service_healthy
    networks: [tunnel]
    restart: unless-stopped
networks:
  database:
    internal: true
  tunnel:
volumes:
  postgres_data:
secrets:
  tunnel_token:
    file: ./secrets/cloudflare-tunnel-token.txt
