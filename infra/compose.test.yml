name: cw-stage1-test
services:
  postgres:
    image: postgres:18.6@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    environment:
      POSTGRES_DB: cw_test
      POSTGRES_USER: cw_test
      POSTGRES_PASSWORD: cw_test_only
    ports:
      - "127.0.0.1:${CW_TEST_DB_PORT:-55432}:5432"
    volumes:
      - cw_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cw_test -d cw_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  cw_test_data:
