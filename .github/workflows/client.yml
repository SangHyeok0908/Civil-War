name: Collector fixture verification
on:
  push:
    paths: ['apps/collector/**', 'apps/web/**', 'packages/**', 'tests/e2e/**', 'scripts/build-collector.mjs', '*config.ts', 'tsconfig.json', 'package.json', 'pnpm-*.yaml', '.npmrc', 'fixtures/**', 'tools/lcu-probe/client.mjs', '.github/workflows/client.yml']
  pull_request:
    paths: ['apps/collector/**', 'apps/web/**', 'packages/**', 'tests/e2e/**', 'scripts/build-collector.mjs', '*config.ts', 'tsconfig.json', 'package.json', 'pnpm-*.yaml', '.npmrc', 'fixtures/**', 'tools/lcu-probe/client.mjs', '.github/workflows/client.yml']
permissions:
  contents: read
jobs:
  client:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: npm install --global pnpm@11.5.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Hosted Windows Electron fixtures (no League or real LCU)
        run: pnpm test:e2e
