name: Collector fixture verification
on:
  push:
    paths:
      [
        "apps/collector/**",
        "apps/web/**",
        "packages/**",
        "tests/e2e/**",
        "scripts/build-collector.mjs",
        "scripts/package-collector.mjs",
        "scripts/collector-release*.mjs",
        "scripts/nsis-integrity*.mjs",
        "scripts/repair-uninstaller*.mjs",
        "patches/**",
        "*config.ts",
        "tsconfig.json",
        "package.json",
        "pnpm-*.yaml",
        ".npmrc",
        "fixtures/**",
        "tools/lcu-probe/client.mjs",
        ".github/workflows/client.yml",
      ]
  pull_request:
    paths:
      [
        "apps/collector/**",
        "apps/web/**",
        "packages/**",
        "tests/e2e/**",
        "scripts/build-collector.mjs",
        "scripts/package-collector.mjs",
        "scripts/collector-release*.mjs",
        "scripts/nsis-integrity*.mjs",
        "scripts/repair-uninstaller*.mjs",
        "patches/**",
        "*config.ts",
        "tsconfig.json",
        "package.json",
        "pnpm-*.yaml",
        ".npmrc",
        "fixtures/**",
        "tools/lcu-probe/client.mjs",
        ".github/workflows/client.yml",
      ]
permissions:
  contents: read
jobs:
  client:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      ELECTRON_BUILDER_7ZIP_PATH: 'C:\Program Files\7-Zip\7z.exe'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.1"
      - run: npm install --global pnpm@11.5.0
      - run: pnpm install --frozen-lockfile
      - name: Check NSIS archive support
        run: |
          $formats = & $env:ELECTRON_BUILDER_7ZIP_PATH i
          if ($LASTEXITCODE -ne 0 -or -not ($formats -match '\bNsis\b')) {
            throw 'The selected 7-Zip must support NSIS archives.'
          }
          $formats | Select-String -Pattern '\bNsis\b'
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:collector-release
      - run: pnpm build
      - name: Hosted Windows Electron fixtures (no League or real LCU)
        run: pnpm test:e2e
      - name: Build unsigned Windows installer (no publishing)
        run: pnpm package:collector
      - run: pnpm verify:collector-release
      - name: Upload installer files for release publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, resolved 2026-11-21
        with:
          name: collector-release
          path: |
            dist/collector/Civil-War-Collector-Setup-*-x64.exe
            dist/collector/SHA256SUMS.txt
            dist/collector/release.json
          retention-days: 1
          if-no-files-found: error
  publish-release:
    needs: client
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: collector-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.1"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, resolved 2026-11-21
        with:
          name: collector-release
          path: dist/collector
      - name: Publish GitHub Release if this version is new
        run: node scripts/collector-release-publish.mjs dist/collector
        env:
          GH_TOKEN: ${{ github.token }}
