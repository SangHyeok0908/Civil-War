name: Server PostgreSQL verification
on:
  push:
    paths: ['apps/server/**', 'apps/web/**', 'packages/**', 'tests/web/**', 'scripts/web-test-server.mjs', 'docs/contracts/**', 'package.json', 'pnpm-*.yaml', '*config.ts', 'tsconfig.json', 'infra/compose.test.yml', 'fixtures/lcu/candidates/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['apps/server/**', 'apps/web/**', 'packages/**', 'tests/web/**', 'scripts/web-test-server.mjs', 'docs/contracts/**', 'package.json', 'pnpm-*.yaml', '*config.ts', 'tsconfig.json', 'infra/compose.test.yml', 'fixtures/lcu/candidates/**', '.github/workflows/server.yml']
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, resolved 2026-10-22
        with:
          distribution: temurin
          java-version: '25.0.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: npm install --global pnpm@11.5.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Start isolated PostgreSQL
        run: docker compose -f infra/compose.test.yml up -d --wait
      - name: Full build including PostgreSQL and packaged recovery tests
        run: ./apps/server/gradlew -p apps/server build --no-daemon --console=plain
      - name: Install Chromium for actual same-origin web tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Real Spring PostgreSQL browser and collector HTTP integration
        run: pnpm test:web
      - name: Stop test database
        if: always()
        run: docker compose -f infra/compose.test.yml down -v
