name: Home server updater verification
on:
  push:
    paths: ["infra/home-server/updater/**", ".github/workflows/updater.yml"]
  pull_request:
    paths: ["infra/home-server/updater/**", ".github/workflows/updater.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-22
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.1"
      - run: node --test infra/home-server/updater/*.test.mjs
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: updater-image
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/sanghyeok0908/civil-war-updater
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-22
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/SangHyeok0908/Civil-War" \
            -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::7}" \
            infra/home-server/updater
      - name: Push image
        run: |
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
